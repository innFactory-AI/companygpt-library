name: Library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate

  docs-build:
    # The docs site (innFactory-AI/docs) renders every skill as a page. Building it against this
    # checkout catches docs-only mistakes (Markdown, frontmatter) before merge. A docs branch with the
    # same name as this PR's branch is used if it exists, so layout changes can be tested in both repos.
    name: Build docs with this library
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: library
      - name: Pick docs branch
        id: docs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/innFactory-AI/docs.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: innFactory-AI/docs
          ref: ${{ steps.docs.outputs.ref }}
          path: docs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Generate skill pages
        run: node scripts/sync-skills.mjs --from "$GITHUB_WORKSPACE/library"
        working-directory: docs
      - name: Build docs
        run: npx --no-install astro build
        working-directory: docs

  notify-docs:
    # Rebuild and redeploy the docs site so it always shows the skills from main.
    # Needs the secret DOCS_DISPATCH_TOKEN: a fine-grained token for innFactory-AI/docs
    # with "Contents: read and write" (required by the repository_dispatch API).
    name: Trigger docs deploy
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to innFactory-AI/docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/innFactory-AI/docs/dispatches \
            -f event_type=skills-updated \
            -f "client_payload[sha]=${GITHUB_SHA}"
