# Curated model labels (English). Format: LibreChat `modelSpecs`, see README.md.
# Adapt to the tenant before use: keep only models it has, check `endpoint`.
modelSpecs:
  prioritize: true
  enforce: false
  # addedEndpoints: [agents, AI-Gateway]   # tenant-specific, see README.md
  list:
  - name: gpt-6-luna
    label: GPT-6 Luna
    description: Fast answers at minimal cost
    default: true
    order: 1
    group: OpenAI
    groupIcon: openAI
    preset:
      endpoint: openAI
      model: gpt-6-luna
      useResponsesApi: true
