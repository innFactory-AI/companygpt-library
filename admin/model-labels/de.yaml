# Kuratierte Modell-Labels (Deutsch). Format: LibreChat `modelSpecs`, siehe README.md.
# Vor dem Einsatz an den Tenant anpassen: nur Modelle behalten, die es dort gibt, `endpoint` pruefen.
modelSpecs:
  prioritize: true
  enforce: false
  # addedEndpoints: [agents, AI-Gateway]   # tenant-specific, see README.md
  list:
  - name: gpt-6-luna
    label: GPT-6 Luna
    description: Schnelle Antworten bei minimalen Kosten
    default: true
    order: 1
    group: OpenAI
    groupIcon: openAI
    preset:
      endpoint: openAI
      model: gpt-6-luna
      useResponsesApi: true
  - name: gpt-6-sol
    label: GPT-6 Sol
    description: Anspruchsvolle Aufgaben mit starker Intelligenz zu fairen Kosten
    order: 2
    group: OpenAI
    preset:
      endpoint: openAI
      model: gpt-6-sol
      useResponsesApi: true
  - name: gpt-6.1-sol
    label: GPT-6.1 Sol
    description: Neueste Version der Sol-Stufe für anspruchsvolle Aufgaben
    order: 3
    group: OpenAI
    preset:
      endpoint: openAI
      model: gpt-6.1-sol
      useResponsesApi: true
  - name: gpt-5.6-sol
    label: GPT-5.6 Sol
    description: Flaggschiff-Stufe mit der höchsten Leistungsfähigkeit
    order: 4
    group: OpenAI
    preset:
