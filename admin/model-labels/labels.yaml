# Curated model labels for companyGPT (label file v2), applied by the companyADMIN label sync.
# One entry per chat model deployed anywhere in the fleet; format and rules: README.md.
version: 2
locales: [de, en]

groups:
  - id: auto
    label: Auto
    icon: openAI
  - id: openai
    label: OpenAI
    icon: openAI
  - id: anthropic
    label: Anthropic
    icon: anthropic
  - id: google
    label: Google
    icon: google
  - id: mistral
    label: Mistral
    icon: mistral
  - id: stackit
    label: STACKIT
    icon: https://storage.googleapis.com/compangygpt-public-data/misc/stackit-icon.svg
  - id: perplexity
    label: Perplexity
    icon: perplexity

models:

  # Auto
  - model: auto
    group: auto
    menu: featured
    label: { de: Auto, en: Auto }
    description:
      de: "Wählt je Anfrage das passende Modell, von kurzen Antworten bis zu komplexen Aufgaben"
      en: "Picks a suitable model for each request, from quick answers to complex tasks"
  - model: auto-standard
    group: auto
    menu: featured
    label: { de: Auto (Standard), en: Auto (Standard) }
    description:
      de: "Wählt je Anfrage das passende Modell, von kurzen Antworten bis zu komplexen Aufgaben"
      en: "Picks a suitable model for each request, from quick answers to complex tasks"
  - model: auto-pro
    group: auto
    menu: featured
    label: { de: Auto Pro, en: Auto Pro }
    description:
      de: "Automatische Modellwahl mit Vorrang für die leistungsstärksten Modelle bei anspruchsvoller Arbeit"
      en: "Automatic model choice that favours the most capable models for demanding work"
  - model: auto-dev
    group: auto
    menu: featured
    label: { de: Auto Dev, en: Auto Dev }
    description:
      de: "Automatische Modellwahl, abgestimmt auf Programmier- und Entwicklungsaufgaben"
      en: "Automatic model choice tuned for programming and development tasks"

